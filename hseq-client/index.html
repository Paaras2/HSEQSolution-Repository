<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/brand/logo-icon-square.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- فونت خودمیزبان است و در main.tsx وارد می‌شود. -->
    <title>مدیریت یکپارچه مدارک و مستندات</title>
    <script>
      // پیش از اولین رنگ‌آمیزی اجرا می‌شود تا صفحه با تم اشتباه بالا نیاید. همان منطقِ
      // src/lib/theme.ts است، عمداً این‌جا تکرار شده چون باید قبل از بارگذاری React اجرا شود.
      (function () {
        try {
          var stored = localStorage.getItem('hseq-theme')
          document.documentElement.dataset.theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
